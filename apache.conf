# Apache's existing DocumentRoot serves /transport/ from /var/www/html/transport/.
# Only the lightweight realtime bridge is proxied to localhost.
ProxyPass "/transport/api/" "http://127.0.0.1:8765/api/"
ProxyPassReverse "/transport/api/" "http://127.0.0.1:8765/api/"

<Directory "/var/www/html/transport">
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml
</Directory>
